<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WE BRANDS | البائع الذكي والرادار التفاعلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #08090b;
      --card-bg: rgba(20, 24, 34, 0.95);
      --border-color: rgba(197, 160, 89, 0.25);
      --accent-gold: #c5a059;
      --accent-gold-glow: rgba(197, 160, 89, 0.45);
      --text-main: #f5f5f7;
      --text-muted: #9aa0a6;
      --success-green: #34d399;
      --mic-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.6rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(8, 9, 11, 0.95);
      backdrop-filter: blur(10px);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo-img {
      height: 42px;
      width: 42px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
    }

    .brand-name-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .radar-controls-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .radar-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s;
    }

    .radar-toggle-btn.active {
      border-color: var(--success-green);
      background: rgba(52, 211, 153, 0.12);
      color: var(--success-green);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
      transition: background 0.3s;
    }

    .pulse-dot.active {
      background: var(--success-green);
      box-shadow: 0 0 10px var(--success-green);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 0.8rem 1.2rem 1.4rem 1.2rem;
      text-align: center;
      cursor: pointer;
      height: calc(100vh - 60px);
    }

    .orb-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .radar-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-gold-glow);
      animation: radarSweep 3s infinite ease-out;
      pointer-events: none;
    }

    .radar-ring:nth-child(2) {
      animation-delay: 1.5s;
    }

    @keyframes radarSweep {
      0% {
        transform: scale(0.65);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    .ai-orb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff5db, var(--accent-gold) 55%, #3a280c 100%);
      box-shadow: 0 0 30px var(--accent-gold), 0 0 60px var(--accent-gold-glow);
      transition: all 0.4s ease;
      z-index: 2;
      animation: idleBreathing 2.6s infinite ease-in-out alternate;
    }

    @keyframes idleBreathing {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.5), 0 0 40px rgba(197, 160, 89, 0.25);
      }
      100% {
        transform: scale(1.04);
        box-shadow: 0 0 35px rgba(197, 160, 89, 0.85), 0 0 70px rgba(197, 160, 89, 0.55);
      }
    }

    .ai-orb.speaking {
      animation: orbPulse 0.8s infinite alternate ease-in-out !important;
    }

    @keyframes orbPulse {
      0% {
        transform: scale(1.02);
        box-shadow: 0 0 30px rgba(197, 160, 89, 0.7);
      }
      100% {
        transform: scale(1.18);
        box-shadow: 0 0 60px rgba(197, 160, 89, 1), 0 0 90px rgba(197, 160, 89, 0.65);
      }
    }

    .welcome-text {
      max-width: 90%;
      margin: 0.2rem auto;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      min-height: 3.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .mic-control-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .mic-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(197, 160, 89, 0.15);
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.35rem;
      transition: all 0.3s;
      outline: none;
    }

    .mic-btn:hover {
      background: var(--accent-gold);
      color: #08090b;
    }

    .mic-btn.listening {
      background: var(--mic-red);
      border-color: #f87171;
      color: #fff;
      animation: micPulse 1.2s infinite;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
    }

    @keyframes micPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .mic-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .categories-grid-main {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.2rem;
      flex-shrink: 0;
    }

    .opt-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.75rem 0.5rem;
      border-radius: 14px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 700;
      transition: all 0.25s;
      text-align: center;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
    }

    .opt-chip:hover, .opt-chip:active {
      border-color: var(--accent-gold);
      background: rgba(197, 160, 89, 0.15);
      color: #fff;
    }

    /* النافذة المنبثقة مع صور المنتجات */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .category-modal {
      background: #11141c;
      border: 1px solid var(--border-color);
      border-bottom: none;
      width: 100%;
      max-width: 500px;
      border-radius: 26px 26px 0 0;
      padding: 1.2rem 1.2rem 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.8rem;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--accent-gold);
    }

    .modal-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-items-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      max-height: 60vh;
      overflow-y: auto;
      padding-left: 2px;
    }

    .modal-item-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 0.75rem;
      display: flex;
      gap: 0.9rem;
      align-items: center;
    }

    .modal-item-img {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      object-fit: cover;
      background: #181c26;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .item-meta {
      flex: 1;
      min-width: 0;
      text-align: right;
    }

    .item-meta h4 {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta p {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 0.3rem;
    }

    .item-meta .item-price {
      color: var(--accent-gold);
      font-weight: 900;
      font-size: 0.95rem;
    }

    .order-item-btn {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
      white-space: nowrap;
    }

    #radar-video, #radar-canvas {
      display: none;
    }
  </style>
</head>
<body onclick="handleGlobalTouch()">

  <header>
    <div class="brand-logo-wrap">
      <img src="logo.png" alt="WE BRANDS" class="brand-logo-img">
      <span class="brand-name-en">WE BRANDS</span>
    </div>
    
    <div class="radar-controls-wrap">
      <button class="radar-toggle-btn active" id="radar-btn" onclick="toggleRadarMode(event)">
        <span class="pulse-dot active" id="radar-status-dot"></span>
        <span id="radar-btn-text">الرادار: يعمل</span>
      </button>
    </div>
  </header>

  <main>
    <div class="orb-wrapper" id="orb-trigger">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="ai-orb" id="voice-orb"></div>
    </div>

    <div class="welcome-text" id="welcome-message">
      أهلاً بك في عالم WE BRANDS.. مستقبل ملابس الستريت وير التقنية. تصفّح أحدث الدروبات، ودعنا نساعدك لاختيارٍ يليق بحضورك.
    </div>

    <div class="mic-control-box">
      <button class="mic-btn" id="voice-mic-btn" onclick="toggleVoiceRecognition(event)" title="تحدث بصوتك">
        🎙️
      </button>
      <span class="mic-label" id="mic-status-label">انقر وتحدث بصوتك أو اختر من الأسفل</span>
    </div>

    <!-- شبكة الأقسام الأربعة -->
    <div class="categories-grid-main">
      <button class="opt-chip" onclick="openCategorySheet('streetwear', event)">ستريت وير والهبات</button>
      <button class="opt-chip" onclick="openCategorySheet('looks', event)">تنسيقات البراند</button>
      <button class="opt-chip" onclick="openCategorySheet('hoodies', event)">الهوديات والقطع الثقيلة</button>
      <button class="opt-chip" onclick="openCategorySheet('basics', event)">البيسك والقطع اليومية</button>
    </div>
  </main>

  <!-- النافذة المنبثقة للقطع مع صورها وتفاصيلها -->
  <div class="modal-overlay" id="category-modal-overlay" onclick="closeCategorySheet(event)">
    <div class="category-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-category-title">القسم</h3>
        <button class="modal-close-btn" onclick="closeCategorySheet(event)">✕</button>
      </div>
      <div class="modal-items-list" id="modal-items-list">
        <!-- يتم تحميل المنتجات بصورها تلقائياً عند النقر -->
      </div>
    </div>
  </div>

  <video id="radar-video" playsinline muted autoplay></video>
  <canvas id="radar-canvas" width="64" height="48"></canvas>

  <script>
    const STORE_WHATSAPP_NUMBER = "966502777884";

    // بيانات المنتجات مع صور ملابس ستريت وير واقعية وعصرية
    const itemsData = {
      streetwear: {
        title: "ستريت وير والهبات",
        items: [
          {
            name: "تيشيرت أوفر سايز جرافيك | Street Drop",
            desc: "قصة بوكس فيت واسعة، قطن فاخر 100% بتصميم عصري",
            price: 240,
            image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80"
          },
          {
            name: "تيشيرت الإصدار المحدود | Black Heavy",
            desc: "خامة ثقيلة معالجة مع طباعة فنية متقنة",
            price: 260,
            image: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=400&q=80"
          }
        ]
      },
      looks: {
        title: "تنسيقات البراند",
        items: [
          {
            name: "تنسيق متكامل | WE Total Outfit",
            desc: "هودي ثقيل وبنطال كارجو متناسق بالكامل",
            price: 490,
            image: "https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?auto=format&fit=crop&w=400&q=80"
          },
          {
            name: "طقم كاجوال يومي | Minimal Set",
            desc: "تيشيرت وبنطال مريح بنمط ستريت وير أنيق",
            price: 360,
            image: "https://images.unsplash.com/photo-1516826957135-700dedea698c?auto=format&fit=crop&w=400&q=80"
          }
        ]
      },
      hoodies: {
        title: "الهوديات والقطع الثقيلة",
        items: [
          {
            name: "هودي WE BRANDS الثقيل (Heavyweight)",
            desc: "قطن صوفية 450 GSM بقبعة دائرية متماسكة",
            price: 295,
            image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=400&q=80"
          },
          {
            name: "جاكيت بامبر شتوي | Street Bomber",
            desc: "خامة عازلة بتفاصيل تكتيكية وجيوب متعددة",
            price: 380,
            image: "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&w=400&q=80"
          }
        ]
      },
      basics: {
        title: "البيسك والقطع اليومية",
        items: [
          {
            name: "تيشيرت بيسك سادة أسود (Essential Boxy)",
            desc: "ياقة محبوكة تدوم، قصة مريحة مناسبة لجميع الأوقات",
            price: 160,
            image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=400&q=80"
          },
          {
            name: "تيشيرت بيسك أبيض خام (Raw Off-White)",
            desc: "قطن طبيعي ناعم جداً للتنسيقات اليومية والطبقات",
            price: 160,
            image: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=400&q=80"
          }
        ]
      }
    };

    let audioUnlocked = false;
    let cameraActive = false;
    let radarEnabled = true;
    let audioCtx = null;
    let recognition = null;
    let isListening = false;
    let currentAudio = null;
    let lastWelcomeTime = 0;

    const orb = document.getElementById('voice-orb');
    const welcomeMsg = document.getElementById('welcome-message');
    const micBtn = document.getElementById('voice-mic-btn');
    const micLabel = document.getElementById('mic-status-label');
    const radarBtn = document.getElementById('radar-btn');
    const dot = document.getElementById('radar-status-dot');
    const radarBtnText = document.getElementById('radar-btn-text');
    const modalOverlay = document.getElementById('category-modal-overlay');
    const modalTitle = document.getElementById('modal-category-title');
    const modalItemsList = document.getElementById('modal-items-list');

    function openCategorySheet(categoryKey, e) {
      if (e) e.stopPropagation();
      handleGlobalTouch();
      playChime();
      playMp3Track('step3-ready.mp3', orb);

      const cat = itemsData[categoryKey];
      if (!cat) return;

      modalTitle.innerText = cat.title;
      modalItemsList.innerHTML = cat.items.map(item => {
        const msg = encodeURIComponent(`مرحباً WE BRANDS، أود طلب: ${item.name} (${item.price} ر.س)`);
        return `
          <div class="modal-item-card">
            <img src="${item.image}" alt="${item.name}" class="modal-item-img">
            <div class="item-meta">
              <h4>${item.name}</h4>
              <p>${item.desc}</p>
              <span class="item-price">${item.price} ر.س</span>
            </div>
            <a href="https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${msg}" target="_blank" class="order-item-btn">
              طلب بواتساب
            </a>
          </div>
        `;
      }).join('');

      modalOverlay.classList.add('active');
    }

    function closeCategorySheet(e) {
      if (e) e.stopPropagation();
      modalOverlay.classList.remove('active');
    }

    function toggleRadarMode(e) {
      if (e) e.stopPropagation();
      radarEnabled = !radarEnabled;

      if (radarEnabled) {
        radarBtn.classList.add('active');
        dot.classList.add('active');
        radarBtnText.innerText = "الرادار: يعمل";
        if (!cameraActive) initCameraRadar();
      } else {
        radarBtn.classList.remove('active');
        dot.classList.remove('active');
        radarBtnText.innerText = "الرادار: موقوف";
      }
    }

    function playMp3Track(filename, targetOrb) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(filename);
      currentAudio.play().then(() => {
        if (targetOrb) targetOrb.classList.add('speaking');
      }).catch(err => {
        console.warn("Audio pending:", filename);
      });
      currentAudio.onended = () => {
        if (targetOrb) targetOrb.classList.remove('speaking');
      };
    }

    function handleGlobalTouch() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioCtx.resume();
        } catch(e) {}
        
        playChime();
        playMp3Track('welcome-mp3.mp3', orb);
        lastWelcomeTime = Date.now();

        if (!cameraActive && radarEnabled) {
          initCameraRadar();
        }
      }
    }

    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micBtn.style.display = 'none';
        micLabel.innerText = "اختر باللمس من الأقسام أدناه";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micLabel.innerText = "أستمع إليك الآن.. تفضل بالتحدث";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim().toLowerCase();
        micLabel.innerText = `سمعتك: "${transcript}"`;
        processVoiceInput(transcript);
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micLabel.innerText = "انقر وتحدث بصوتك أو اختر من الأسفل";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };
    }

    function toggleVoiceRecognition(e) {
      if (e) e.stopPropagation();
      handleGlobalTouch();

      if (!recognition) initSpeechRecognition();
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch(err) {
          console.warn(err);
        }
      }
    }

    function processVoiceInput(text) {
      playChime();
      if (text.includes("ستريت") || text.includes("هبات") || text.includes("هبة")) {
        openCategorySheet('streetwear');
      } else if (text.includes("تنسيق") || text.includes("طقم")) {
        openCategorySheet('looks');
      } else if (text.includes("هودي") || text.includes("ثقيل") || text.includes("شتوي")) {
        openCategorySheet('hoodies');
      } else {
        openCategorySheet('basics');
      }
    }

    function initCameraRadar() {
      const video = document.getElementById('radar-video');
      const canvas = document.getElementById('radar-canvas');
      const ctx = canvas.getContext('2d');
      let prevFrame = null;

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 128, height: 96 } })
        .then(stream => {
          video.srcObject = stream;
          cameraActive = true;

          setInterval(() => {
            if (!radarEnabled || video.readyState < 2) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (prevFrame) {
              let diff = 0;
              for (let i = 0; i < currentFrame.data.length; i += 4) {
                diff += Math.abs(currentFrame.data[i] - prevFrame.data[i]);
              }
              const score = diff / (canvas.width * canvas.height);
              
              if (score > 18 && (Date.now() - lastWelcomeTime > 45000)) {
                lastWelcomeTime = Date.now();
                if (!audioUnlocked) {
                  handleGlobalTouch();
                } else if (!currentAudio || currentAudio.paused) {
                  playMp3Track('welcome-mp3.mp3', orb);
                }
              }
            }
            prevFrame = currentFrame;
          }, 400);
        })
        .catch(err => {
          dot.classList.remove('active');
          dot.style.background = '#71717a';
          radarBtnText.innerText = "الكاميرا محظورة";
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
      initCameraRadar();
    });
  </script>
</body>
</html>
