<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WE BRANDS | البائع الذكي والرادار التفاعلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #08090b;
      --card-bg: rgba(20, 24, 34, 0.85);
      --border-color: rgba(197, 160, 89, 0.25);
      --accent-gold: #c5a059;
      --accent-gold-glow: rgba(197, 160, 89, 0.45);
      --text-main: #f5f5f7;
      --text-muted: #9aa0a6;
      --success-green: #34d399;
      --mic-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.6rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(8, 9, 11, 0.95);
      backdrop-filter: blur(10px);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo-img {
      height: 44px;
      width: 44px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
    }

    .brand-name-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .radar-controls-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .radar-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s;
    }

    .radar-toggle-btn.active {
      border-color: var(--success-green);
      background: rgba(52, 211, 153, 0.12);
      color: var(--success-green);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
      transition: background 0.3s;
    }

    .pulse-dot.active {
      background: var(--success-green);
      box-shadow: 0 0 10px var(--success-green);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* الشاشة الرئيسية الوحيدة */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 0.8rem 1.2rem 1.4rem 1.2rem;
      text-align: center;
      cursor: pointer;
      height: calc(100vh - 60px);
    }

    .orb-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .radar-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-gold-glow);
      animation: radarSweep 3s infinite ease-out;
      pointer-events: none;
    }

    .radar-ring:nth-child(2) {
      animation-delay: 1.5s;
    }

    @keyframes radarSweep {
      0% {
        transform: scale(0.65);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    .ai-orb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff5db, var(--accent-gold) 55%, #3a280c 100%);
      box-shadow: 0 0 30px var(--accent-gold), 0 0 60px var(--accent-gold-glow);
      transition: all 0.4s ease;
      z-index: 2;
      animation: idleBreathing 2.6s infinite ease-in-out alternate;
    }

    @keyframes idleBreathing {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.5), 0 0 40px rgba(197, 160, 89, 0.25);
      }
      100% {
        transform: scale(1.04);
        box-shadow: 0 0 35px rgba(197, 160, 89, 0.85), 0 0 70px rgba(197, 160, 89, 0.55);
      }
    }

    .ai-orb.speaking {
      animation: orbPulse 0.8s infinite alternate ease-in-out !important;
    }

    @keyframes orbPulse {
      0% {
        transform: scale(1.02);
        box-shadow: 0 0 30px rgba(197, 160, 89, 0.7);
      }
      100% {
        transform: scale(1.18);
        box-shadow: 0 0 60px rgba(197, 160, 89, 1), 0 0 90px rgba(197, 160, 89, 0.65);
      }
    }

    .welcome-text {
      max-width: 90%;
      margin: 0.2rem auto;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      min-height: 3.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .mic-control-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .mic-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(197, 160, 89, 0.15);
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.35rem;
      transition: all 0.3s;
      outline: none;
    }

    .mic-btn:hover {
      background: var(--accent-gold);
      color: #08090b;
    }

    .mic-btn.listening {
      background: var(--mic-red);
      border-color: #f87171;
      color: #fff;
      animation: micPulse 1.2s infinite;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
    }

    @keyframes micPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .mic-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .categories-grid-main {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.2rem;
      flex-shrink: 0;
    }

    .opt-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.75rem 0.5rem;
      border-radius: 14px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 700;
      transition: all 0.25s;
      text-align: center;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
    }

    .opt-chip:hover, .opt-chip:active {
      border-color: var(--accent-gold);
      background: rgba(197, 160, 89, 0.15);
      color: #fff;
    }

    #radar-video, #radar-canvas {
      display: none;
    }
  </style>
</head>
<body onclick="handleGlobalTouch()">

  <header>
    <div class="brand-logo-wrap">
      <img src="logo.png" alt="WE BRANDS" class="brand-logo-img">
      <span class="brand-name-en">WE BRANDS</span>
    </div>
    
    <div class="radar-controls-wrap">
      <button class="radar-toggle-btn active" id="radar-btn" onclick="toggleRadarMode(event)">
        <span class="pulse-dot active" id="radar-status-dot"></span>
        <span id="radar-btn-text">الرادار: يعمل</span>
      </button>
    </div>
  </header>

  <!-- الشاشة الرئيسية الموحدة الخالية من أي تمرير -->
  <main>
    <div class="orb-wrapper" id="orb-trigger">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="ai-orb" id="voice-orb"></div>
    </div>

    <div class="welcome-text" id="welcome-message">
      أهلاً بك في عالم WE BRANDS.. مستقبل ملابس الستريت وير التقنية. تصفّح أحدث الدروبات، ودعنا نساعدك لاختيارٍ يليق بحضورك.
    </div>

    <div class="mic-control-box">
      <button class="mic-btn" id="voice-mic-btn" onclick="toggleVoiceRecognition(event)" title="تحدث بصوتك">
        🎙️
      </button>
      <span class="mic-label" id="mic-status-label">انقر وتحدث بصوتك أو اختر من الأسفل</span>
    </div>

    <!-- شبكة الأقسام الأربعة المعتمدة -->
    <div class="categories-grid-main">
      <button class="opt-chip" onclick="handleCategorySelect('ستريت وير والهبات', event)">ستريت وير والهبات</button>
      <button class="opt-chip" onclick="handleCategorySelect('تنسيقات البراند', event)">تنسيقات البراند</button>
      <button class="opt-chip" onclick="handleCategorySelect('الهوديات والقطع الثقيلة', event)">الهوديات والقطع الثقيلة</button>
      <button class="opt-chip" onclick="handleCategorySelect('البيسك والقطع اليومية', event)">البيسك والقطع اليومية</button>
    </div>
  </main>

  <video id="radar-video" playsinline muted autoplay></video>
  <canvas id="radar-canvas" width="64" height="48"></canvas>

  <script>
    let audioUnlocked = false;
    let cameraActive = false;
    let radarEnabled = true;
    let audioCtx = null;
    let recognition = null;
    let isListening = false;
    let currentAudio = null;
    let lastWelcomeTime = 0;

    const orb = document.getElementById('voice-orb');
    const welcomeMsg = document.getElementById('welcome-message');
    const micBtn = document.getElementById('voice-mic-btn');
    const micLabel = document.getElementById('mic-status-label');
    const radarBtn = document.getElementById('radar-btn');
    const dot = document.getElementById('radar-status-dot');
    const radarBtnText = document.getElementById('radar-btn-text');

    function toggleRadarMode(e) {
      if (e) e.stopPropagation();
      radarEnabled = !radarEnabled;

      if (radarEnabled) {
        radarBtn.classList.add('active');
        dot.classList.add('active');
        radarBtnText.innerText = "الرادار: يعمل";
        if (!cameraActive) initCameraRadar();
      } else {
        radarBtn.classList.remove('active');
        dot.classList.remove('active');
        radarBtnText.innerText = "الرادار: موقوف";
      }
    }

    function playMp3Track(filename, targetOrb) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(filename);
      currentAudio.play().then(() => {
        if (targetOrb) targetOrb.classList.add('speaking');
      }).catch(err => {
        console.warn("Playback prevented or audio pending:", filename);
      });
      currentAudio.onended = () => {
        if (targetOrb) targetOrb.classList.remove('speaking');
      };
    }

    function handleGlobalTouch() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioCtx.resume();
        } catch(e) {}
        
        playChime();
        playMp3Track('welcome-mp3.mp3', orb);
        lastWelcomeTime = Date.now();

        if (!cameraActive && radarEnabled) {
          initCameraRadar();
        }
      }
    }

    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micBtn.style.display = 'none';
        micLabel.innerText = "اختر باللمس من الأقسام أدناه";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micLabel.innerText = "أستمع إليك الآن.. تفضل بالتحدث";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim().toLowerCase();
        micLabel.innerText = `سمعتك: "${transcript}"`;
        processVoiceInput(transcript);
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micLabel.innerText = "انقر وتحدث بصوتك أو اختر من الأسفل";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };
    }

    function toggleVoiceRecognition(e) {
      if (e) e.stopPropagation();
      handleGlobalTouch();

      if (!recognition) initSpeechRecognition();
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch(err) {
          console.warn(err);
        }
      }
    }

    function processVoiceInput(text) {
      playChime();
      if (text.includes("ستريت") || text.includes("هبات") || text.includes("هبة")) {
        handleCategorySelect('ستريت وير والهبات');
      } else if (text.includes("تنسيق") || text.includes("طقم")) {
        handleCategorySelect('تنسيقات البراند');
      } else if (text.includes("هودي") || text.includes("ثقيل") || text.includes("شتوي")) {
        handleCategorySelect('الهوديات والقطع الثقيلة');
      } else {
        handleCategorySelect('البيسك والقطع اليومية');
      }
    }

    function handleCategorySelect(categoryName, e) {
      if (e) e.stopPropagation();
      handleGlobalTouch();
      playChime();

      welcomeMsg.innerText = `تم اختيار قسم [${categoryName}].. ذوقك رفيع وخيار يليق بحضورك في WE BRANDS!`;
      playMp3Track('step3-ready.mp3', orb);

      // إعادة النص الترحيبي الأصلي بعد 6 ثوانٍ تلقائياً
      setTimeout(() => {
        welcomeMsg.innerText = "أهلاً بك في عالم WE BRANDS.. مستقبل ملابس الستريت وير التقنية. تصفّح أحدث الدروبات، ودعنا نساعدك لاختيارٍ يليق بحضورك.";
      }, 6000);
    }

    function initCameraRadar() {
      const video = document.getElementById('radar-video');
      const canvas = document.getElementById('radar-canvas');
      const ctx = canvas.getContext('2d');
      let prevFrame = null;

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 128, height: 96 } })
        .then(stream => {
          video.srcObject = stream;
          cameraActive = true;

          setInterval(() => {
            if (!radarEnabled || video.readyState < 2) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (prevFrame) {
              let diff = 0;
              for (let i = 0; i < currentFrame.data.length; i += 4) {
                diff += Math.abs(currentFrame.data[i] - prevFrame.data[i]);
              }
              const score = diff / (canvas.width * canvas.height);
              
              if (score > 18 && (Date.now() - lastWelcomeTime > 45000)) {
                lastWelcomeTime = Date.now();
                if (!audioUnlocked) {
                  handleGlobalTouch();
                } else if (!currentAudio || currentAudio.paused) {
                  playMp3Track('welcome-mp3.mp3', orb);
                }
              }
            }
            prevFrame = currentFrame;
          }, 400);
        })
        .catch(err => {
          dot.classList.remove('active');
          dot.style.background = '#71717a';
          radarBtnText.innerText = "الكاميرا محظورة";
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
      initCameraRadar();
    });
  </script>
</body>
</html>
